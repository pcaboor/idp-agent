name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token reads the repository and does nothing else: nothing here pushes,
# comments or publishes, and a step that would has to say so in this file.
permissions:
  contents: read

# A push to a pull request makes the run for its previous commit stale. A
# push to main does not: every merge keeps its verdict, so each run on main is
# a group of its own and nothing cancels or queues it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung process — a prompt nobody answers, a smoke check waiting on a
    # child — fails here instead of holding a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in engines, and a current release. A tool installed
        # with npx runs on whatever the user already has.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing after the checkout talks to the remote, so the token is not
          # left in .git/config for every later step to read.
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # No API key, no network, no Docker: the suite never reaches a model.
      # A contributor — or a reviewer who just cloned the repository — runs
      # exactly these five commands.
      - run: pnpm test

      - run: pnpm build

      # The packaged binary, which the unit suite never runs: it imports the
      # modules instead. bin.js resolves the fixture SI from import.meta.url, so
      # a dist layout change ships broken with every test green.
      - run: pnpm smoke
