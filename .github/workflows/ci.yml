name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in engines, and a current release. A tool installed
        # with npx runs on whatever the user already has.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # No API key, no network, no Docker: the suite never reaches a model.
      # A contributor — or a reviewer who just cloned the repository — runs
      # exactly these four commands.
      - run: pnpm test

      - run: pnpm build
